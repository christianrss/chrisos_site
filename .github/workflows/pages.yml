name: Build and deploy ChrisOS documentation

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout documentation
        uses: actions/checkout@v4
        with:
          path: docs-repo

      - name: Checkout ChrisOS main
        uses: actions/checkout@v4
        with:
          repository: christianrss/ChrisOS
          ref: main
          fetch-depth: 200
          path: docs-repo/.source

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: docs-repo/requirements.txt

      - name: Install system diagram tool
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Install documentation dependencies
        working-directory: docs-repo
        run: pip install --retries 10 --timeout 60 -r requirements.txt

      - name: Run documentation unit tests
        working-directory: docs-repo
        run: python -m unittest discover -s tests

      - name: Generate source facts, diagrams and review queue
        working-directory: docs-repo
        run: python scripts/build_all.py --source .source --docs docs

      - name: Verify documented arithmetic against ChrisCPU source
        working-directory: docs-repo
        run: python scripts/check_arithmetic.py --source .source

      - name: Verify documented instruction and register contracts
        # Keep executable evidence separate from the documentation build.
        working-directory: docs-repo
        run: python scripts/check_instruction_contracts.py --source .source

      - name: Verify MMU contracts and documented limitations
        working-directory: docs-repo
        run: python scripts/check_mmu.py --source .source

      - name: Verify illustrative cache calculations
        working-directory: docs-repo
        run: python scripts/check_cache_examples.py

      - name: Verify illustrative coherence transitions
        working-directory: docs-repo
        run: python scripts/check_coherence_examples.py

      - name: Verify illustrative memory-order outcomes
        working-directory: docs-repo
        run: python scripts/check_memory_model_examples.py

      - name: Verify illustrative bus and DMA calculations
        working-directory: docs-repo
        run: python scripts/check_bus_dma_examples.py

      - name: Verify illustrative PCI and PCIe calculations
        working-directory: docs-repo
        run: python scripts/check_pci_examples.py

      - name: Verify illustrative ACPI table calculations
        working-directory: docs-repo
        run: python scripts/check_acpi_examples.py

      - name: Verify reset and firmware contracts
        working-directory: docs-repo
        run: python scripts/check_reset_firmware_examples.py --source .source

      - name: Verify UEFI contracts and installer assumptions
        working-directory: docs-repo
        run: python scripts/check_uefi_examples.py --source .source

      - name: Verify Limine contracts and ownership boundaries
        working-directory: docs-repo
        run: python scripts/check_limine_examples.py --source .source

      - name: Verify boot information ownership and normalization
        working-directory: docs-repo
        run: python scripts/check_boot_information_examples.py --source .source

      - name: Verify ELF and linker contracts
        working-directory: docs-repo
        run: python scripts/check_elf_linking_examples.py --source .source

      - name: Verify linker script contracts
        working-directory: docs-repo
        run: python scripts/check_linker_script_examples.py --source .source

      - name: Verify higher-half address and paging contracts
        working-directory: docs-repo
        run: python scripts/check_higher_half_examples.py --source .source

      - name: Verify power-on and kstart boot contracts
        working-directory: docs-repo
        run: python scripts/check_power_on_kstart_examples.py --source .source

      - name: Verify kernel model and trust-boundary contracts
        working-directory: docs-repo
        run: python scripts/check_kernel_model_examples.py --source .source

      - name: Verify electrical foundation examples
        working-directory: docs-repo
        run: python scripts/check_electric_field_examples.py

      - name: Verify voltage, current, resistance and power examples
        working-directory: docs-repo
        run: python scripts/check_voltage_current_power_examples.py

      - name: Verify circuit analysis and field-storage examples
        working-directory: docs-repo
        run: python scripts/check_circuit_foundations_examples.py

      - name: Verify transient and AC examples
        working-directory: docs-repo
        run: python scripts/check_transients_ac_examples.py

      - name: Verify induction and transformer examples
        working-directory: docs-repo
        run: python scripts/check_induction_transformer_examples.py

      - name: Verify transmission line and differential signaling examples
        working-directory: docs-repo
        run: python scripts/check_transmission_line_examples.py --source .source

      - name: Verify noise grounding and signal integrity examples
        working-directory: docs-repo
        run: python scripts/check_signal_integrity_examples.py --source .source

      - name: Verify power delivery regulation and decoupling examples
        working-directory: docs-repo
        run: python scripts/check_power_delivery_examples.py --source .source

      - name: Verify MOS electrostatics and CMOS switching examples
        working-directory: docs-repo
        run: python scripts/check_mos_cmos_examples.py --source .source

      - name: Verify number systems and binary arithmetic examples
        working-directory: docs-repo
        run: python scripts/check_number_systems_examples.py --source .source

      - name: Verify discrete mathematics, proof and invariant examples
        working-directory: docs-repo
        run: python scripts/check_discrete_proof_examples.py --source .source

      - name: Verify recursion and linear structure examples
        working-directory: docs-repo
        run: python scripts/check_recursion_linear_structures.py --source .source

      - name: Verify reader JavaScript syntax
        working-directory: docs-repo
        run: |
          node --check docs/assets/site.js
          node --check docs/assets/search-worker.js

      - name: Build static site
        working-directory: docs-repo
        run: mkdocs build --strict

      - name: Smoke test generated reader
        working-directory: docs-repo
        run: python scripts/check_built_reader.py --site site

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs-repo/site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
