site_name: ChrisOS Operating System Research
site_description: ChrisOS is an experimental x86-64 operating system and systems research project covering kernel engineering, compilers, filesystems, graphics, networking, emulation and virtualization.
site_url: https://os.christiansoftware.org/
site_author: Christian Rafael de Souza Silva
repo_url: https://github.com/christianrss/ChrisOS
edit_uri: https://github.com/christianrss/chrisos_site/edit/main/docs/

theme:
  name: null
  custom_dir: theme

plugins:
  - search:
      lang:
        - en
        - pt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys

extra_css:
  - assets/site.css

extra_javascript:
  - assets/site.js

copyright: "ChrisOS © 2026 Christian Rafael de Souza Silva — Creator & Lead Developer"

hooks:
  - scripts/site_hooks.py

validation:
  nav:
    omitted_files: ignore

exclude_docs: |
  !en/99-source-atlas/generated/**
  !pt-br/99-source-atlas/generated/**
