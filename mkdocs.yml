site_name: ChrisOS Research Project
site_description: Technical documentation of ChrisOS, computing systems, kernel engineering, compilers, graphics and emulation.
site_url: https://os.christiansoftware.org/
repo_url: https://github.com/christianrss/ChrisOS
edit_uri: https://github.com/christianrss/chrisos_site/edit/main/docs/

theme:
  name: null
  custom_dir: theme

plugins:
  - search:
      lang:
        - en
        - pt

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 4
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
  - pymdownx.inlinehilite
  - pymdownx.keys

extra_css:
  - assets/site.css

extra_javascript:
  - assets/site.js

copyright: "ChrisOS Research Project — technical documentation"
