site_name: ChrisOS / Documentation
site_description: Official documentation for the ChrisOS operating system ecosystem.
site_url: https://christianrss.github.io/chrisos_site/
repo_url: https://github.com/christianrss/ChrisOS
repo_name: christianrss/ChrisOS
edit_uri: https://github.com/christianrss/chrisos_site/edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/images/ChrisOS_Monolito.png
  favicon: assets/images/ChrisOS_Monolito.png
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
  palette:
    scheme: slate

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite

extra_css:
  - assets/stylesheets/retro.css

extra_javascript:
  - assets/javascripts/retro.js

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/christianrss/ChrisOS

